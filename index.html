<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INSTAGRAM</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #151618;
    --border: #3a3d42;
    --text: #f5f5f5;
    --muted: #a8adb4;
    --blue: #0064e0;
    --blue-hover: #0a77ff;
    --link: #4aa3ff;
    --grad: linear-gradient(90deg, #ff7a3d, #ff2d87 55%, #c013d6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .main { flex: 1; display: flex; }

  /* Kiri */
  .hero {
    flex: 1.3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
  }
  .logo {
    position: absolute; top: 32px; left: 40px;
    width: 52px; height: 52px; object-fit: contain;
  }
  .hero h1 {
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 400;
    line-height: 1.25;
    text-align: center;
    max-width: 440px;
    margin-bottom: 48px;
  }
  .hero h1 span {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .cards { position: relative; width: 400px; height: 380px; }
  .card {
    position: absolute; border-radius: 26px; overflow: hidden;
  }
  .c1 { left: 0; top: 40px; width: 130px; height: 300px;
        background: linear-gradient(160deg, #2bd96b, #ff3db0); transform: rotate(-4deg); }
  .c2 { left: 100px; top: 0; width: 190px; height: 380px; z-index: 2;
        background: linear-gradient(170deg, #f6b73c, #d9574a 60%, #6d2b5e); box-shadow: 0 10px 40px #0008; }
  .c3 { left: 270px; top: 50px; width: 130px; height: 290px;
        background: linear-gradient(200deg, #6fa8ff, #b85bff); transform: rotate(4deg); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c2 img { object-position: 38% center; }
  .card.c2::after {
    content: "\2665"; position: absolute; right: 14px; bottom: 14px;
    font-size: 26px; color: #fff;
  }

  /* Kanan */
  .panel {
    flex: 1;
    max-width: 650px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 50px;
  }
  form { width: 100%; max-width: 440px; }
  form h2 { font-size: 17px; font-weight: 500; margin-bottom: 26px; }

  .field { position: relative; margin-bottom: 12px; }
  .field input {
    width: 100%; height: 58px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 16px 6px;
    color: var(--text); font-size: 16px;
    outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--link); }
  .field label {
    position: absolute; left: 16px; top: 19px;
    color: var(--muted); font-size: 15px;
    pointer-events: none; transition: all .15s;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label { top: 8px; font-size: 11.5px; }
  .toggle {
    position: absolute; right: 14px; top: 17px;
    background: none; border: 0; color: var(--muted);
    font-size: 13px; cursor: pointer; display: none;
  }
  .field input:not(:placeholder-shown) ~ .toggle { display: block; }

  .btn {
    width: 100%; height: 44px; margin-top: 12px;
    border: 0; border-radius: 22px;
    background: var(--blue); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { background: var(--blue-hover); }
  .btn:disabled { opacity: .5; cursor: default; }

  .forgot { display: block; text-align: center; margin: 22px 0 60px; font-size: 14px; color: var(--text); text-decoration: none; }
  .forgot:hover { text-decoration: underline; }

  .btn-alt {
    display: block; width: 100%; height: 44px; line-height: 42px;
    border-radius: 22px; text-align: center; text-decoration: none;
    font-size: 14.5px; margin-bottom: 12px; cursor: pointer;
  }
  .fb { background: #25272b; color: var(--text); border: 0; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-icon { width: 18px; height: 18px; }
  .fb:hover { background: #2f3236; }
  .create { border: 1px solid var(--blue-hover); color: var(--link); }
  .create:hover { background: #0a77ff18; }

  .msg { color: #ff6b81; font-size: 13.5px; margin-top: 12px; text-align: center; min-height: 18px; }

  footer {
    border-top: 1px solid var(--border);
    padding: 22px 16px; text-align: center;
    font-size: 12px; color: var(--muted);
  }
  footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin-bottom: 12px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 860px) {
    .hero { display: none; }
    .panel { max-width: none; border: 0; background: var(--bg); padding: 32px 20px; }
  }
  /* Layar login & cari akun */
  .screen { width: 100%; max-width: 440px; display: flex; flex-direction: column; }
  .screen[hidden] { display: none; }
  .m-lang, .m-logo, .m-meta, .ficon { display: none; }
  #loginForm { display: flex; flex-direction: column; }
  #findScreen h3 { font-size: 20px; font-weight: 600; margin: 18px 0 8px; }
  #findScreen p { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .back { background: none; border: 0; color: var(--text); font-size: 26px; line-height: 1; cursor: pointer; align-self: flex-start; padding: 0; }
  .cant { color: #7b86ff; font-size: 13.5px; text-decoration: none; margin-bottom: 22px; align-self: flex-start; }
  .link-btn { background: none; border: 0; color: var(--text); font: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer; margin: 22px auto; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .fb-outline { background: transparent; border: 1px solid var(--border); }
  .fb-outline:hover { background: #ffffff0d; }

  /* Tampilan handphone */
  @media (max-width: 600px) {
    :root { --blue: #2f3cff; --blue-hover: #4a55ff; }
    body { background: #0f0f10; }
    .panel { padding: 0; background: #0f0f10; align-items: stretch; }
    .screen { max-width: none; min-height: 100vh; min-height: 100dvh; padding: 20px 20px 24px; }
    .m-lang { display: block; text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 36px; }
    .m-logo { display: block; width: 64px; height: 64px; margin: 0 auto 56px; }
    #loginForm { flex: 1; }
    #loginForm h2 { display: none; }
    .field input { height: 50px; border-radius: 10px; padding: 20px 44px 4px 14px; font-size: 15px; }
    .field label { left: 14px; top: 15px; font-size: 14px; }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label { top: 6px; font-size: 11px; }
    .toggle { top: 15px; }
    .ficon { display: block; position: absolute; right: 14px; top: 15px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
    .field input:not(:placeholder-shown) ~ .ficon { display: none; }
    .btn { height: 46px; border-radius: 10px; }
    .forgot { margin: 20px 0 0; }
    .desk-only { display: none; }
    .btn-alt { border-radius: 10px; height: 46px; }
    .create { margin-top: auto; border-color: #3a46ff; color: #6b75ff; margin-bottom: 0; line-height: 44px; }
    .m-meta { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; color: var(--muted); font-size: 14px; }
    footer { display: none; }
  }
</style>
</head>
<body>
<div class="main">
  <section class="hero">
    <img class="logo" src="images/IG.png" alt="Moments">
    <h1>查看<span>親密好友</span>的日常瞬間。</h1>
    <div class="cards" aria-hidden="true">
      <div class="card c1"><img src="images/card-left.png" alt=""></div>
      <div class="card c2"><img src="images/card-center.png" alt=""></div>
      <div class="card c3"><img src="images/card-right.jpg" alt=""></div>
    </div>
  </section>

  <section class="panel">
    <div class="screen" id="loginScreen">
      <div class="m-lang">繁體中文 &#9662;</div>
      <img class="m-logo" src="images/IG.png" alt="Moments">

      <form id="loginForm" novalidate>
        <h2>登入 Moments</h2>

        <div class="field">
          <input type="text" id="user" placeholder=" " autocomplete="username">
          <label for="user">手機號碼、使用者名稱或電子郵件</label>
          <svg class="ficon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.600 8 7"/></svg>
        </div>

        <div class="field">
          <input type="password" id="pass" placeholder=" " autocomplete="current-password">
          <label for="pass">密碼</label>
          <button type="button" class="toggle" id="toggle">顯示</button>
        </div>

        <button class="btn" id="submit" type="submit" disabled>登入</button>
        <div class="msg" id="msg" role="alert"></div>

        <a class="forgot" id="forgotLink" href="#">忘記密碼？</a>

        <button type="button" class="btn-alt fb desk-only"><img class="btn-icon" src="images/FB.png" alt="">使用 Facebook 登入</button>
        <a class="btn-alt create" href="#">建立新帳號</a>
      </form>

      <div class="m-meta"><svg viewBox="0 0 26 12" width="22" height="11" aria-hidden="true"><path d="M6.500 1C3 1 1.500 4 1.500 6s1.500 5 5 5c3 0 4.500-3 6.500-5s3.500-5 6.500-5c3.500 0 5 3 5 5s-1.500 5-5 5c-3 0-4.500-3-6.500-5S9.500 1 6.500 1z" fill="none" stroke="currentColor" stroke-width="2"/></svg> Meta</div>
    </div>

    <div class="screen" id="findScreen" hidden>
      <button type="button" class="back" id="backBtn" aria-label="返回">&larr;</button>
      <h3>尋找你的帳號</h3>
      <p>輸入你的電子郵件或使用者名稱。</p>
      <a class="cant" href="#">無法重設密碼？</a>

      <div class="field">
        <input type="text" id="findInput" placeholder=" " autocomplete="username">
        <label for="findInput">電子郵件或使用者名稱</label>
      </div>

      <button class="btn" id="findBtn" type="button" disabled>繼續</button>
      <div class="msg" id="findMsg" role="alert"></div>

      <button type="button" class="link-btn">以手機號碼尋找</button>
      <div class="or">或</div>
      <button type="button" class="btn-alt fb fb-outline"><img class="btn-icon" src="images/FB.png" alt="">使用 Facebook 登入</button>
    </div>
  </section>
</div>

<footer>
  <nav>
    <a href="#">關於</a><a href="#">部落格</a><a href="#">徵才</a><a href="#">說明</a>
    <a href="#">API</a><a href="#">隱私權</a><a href="#">條款</a><a href="#">地區</a>
  </nav>
  <div>繁體中文 &nbsp;·&nbsp; © 2026 Moments</div>
</footer>

<script>
  const user = document.getElementById('user');
  const pass = document.getElementById('pass');
  const submit = document.getElementById('submit');
  const toggle = document.getElementById('toggle');
  const msg = document.getElementById('msg');

  function check() { submit.disabled = !(user.value.trim() && pass.value.length >= 6); }
  user.addEventListener('input', check);
  pass.addEventListener('input', check);

  toggle.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隱藏' : '顯示';
  });

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    // 僅為示範：在此處連接你的後端（fetch 登入 API）。
    msg.textContent = '這只是示範頁面，尚未連接伺服器。';
  });

  const loginScreen = document.getElementById('loginScreen');
  const findScreen = document.getElementById('findScreen');
  const findInput = document.getElementById('findInput');
  const findBtn = document.getElementById('findBtn');

  function show(name) {
    loginScreen.hidden = name !== 'login';
    findScreen.hidden = name !== 'find';
  }
  document.getElementById('forgotLink').addEventListener('click', e => { e.preventDefault(); show('find'); });
  document.getElementById('backBtn').addEventListener('click', () => show('login'));
  findInput.addEventListener('input', () => { findBtn.disabled = !findInput.value.trim(); });
  findBtn.addEventListener('click', () => {
    document.getElementById('findMsg').textContent = '這只是示範頁面，尚未連接伺服器。';
  });
</script>
</body>
</html>
